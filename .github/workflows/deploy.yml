name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys interleave on the box; queue instead of cancelling, so a
# run that has already started rsyncing is allowed to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Built here rather than on the box, which has ~200 MB of RAM free and
      # would likely OOM running Vite.
      - name: Build client
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync artifacts
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .env \
            server/ "$HOST:/home/ubuntu/openhabit/server/"
          rsync -az --delete client/dist/ "$HOST:/home/ubuntu/openhabit/client/dist/"

      - name: Install deps, publish SPA, restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$HOST" bash -euo pipefail <<'REMOTE'
            # /usr/bin/node on the box is v12. npm's shebang is `#!/usr/bin/env
            # node`, so nvm's bin has to be on PATH — an absolute path to npm
            # alone would still resolve the wrong node.
            export PATH=/home/ubuntu/.nvm/versions/node/v20.13.1/bin:$PATH
            cd /home/ubuntu/openhabit/server
            npm ci --omit=dev --silent
            sudo rsync -a --delete /home/ubuntu/openhabit/client/dist/ /webdirectory/openhabit/
            sudo systemctl restart openhabit
          REMOTE

      # The service connects to Atlas before it binds, so give it room to come
      # up rather than failing on the first probe.
      - name: Health check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$HOST" bash -euo pipefail <<'REMOTE'
            for i in $(seq 1 15); do
              if curl -fsS --max-time 5 localhost:8124/api/health; then
                echo
                echo "healthy"
                exit 0
              fi
              sleep 3
            done
            echo "service did not come up:"
            sudo journalctl -u openhabit -n 40 --no-pager
            exit 1
          REMOTE

      - name: Verify public site
        run: curl -fsS --max-time 20 https://openhabit.co/api/health
